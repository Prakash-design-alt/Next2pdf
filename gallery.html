<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altema Files</title>

<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e5e9f2;
  --text: #1e293b;
  --muted: #64748b;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --pdf: #dc2626;
  --img: #0891b2;
  --folder: #f59e0b;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.06);
  --radius: 14px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
button, input { font: inherit; }
button { cursor: pointer; }
svg { display: block; }

/* Login */
#loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card {
  width: 100%; max-width: 380px; background: var(--surface); border-radius: 18px;
  box-shadow: var(--shadow); padding: 40px 32px; text-align: center;
}
.logo-mark {
  width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.login-card h1 { font-size: 22px; margin: 0 0 6px; }
.login-card p { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
.google-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 12px; border: 1px solid var(--border); border-radius: 10px;
  background: #fff; color: var(--text); font-weight: 600; font-size: 15px;
  transition: background .15s, box-shadow .15s;
}
.google-btn:hover { background: var(--surface-2); box-shadow: var(--shadow); }
.login-err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 14px; }

/* App shell */
#appView { display: none; }
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--border); padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; white-space: nowrap; }
.brand .logo-mark { width: 34px; height: 34px; border-radius: 10px; margin: 0; }
.brand .logo-mark svg { width: 18px; height: 18px; }
.search { flex: 1; max-width: 560px; position: relative; }
.search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted);
}
.search input {
  width: 100%; padding: 10px 14px 10px 38px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text); outline: none;
}
.search input:focus {
  border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.user-chip {
  font-size: 13px; color: var(--muted); max-width: 200px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 14px; font-weight: 500; transition: background .15s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn svg { width: 16px; height: 16px; }
.direct-link {
  display: inline-flex; align-items: center; padding: 9px 14px;
  border-radius: 10px; background: var(--primary); color: #fff;
  font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
}
.direct-link:hover { background: var(--primary-dark); }

/* Scrolling notice (moves right to left) */
.ticker {
  background: #eef4ff; color: #1d4ed8; font-size: 13px; font-weight: 600;
  overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--border);
  padding: 7px 0;
}
.ticker-text {
  display: inline-block; padding-left: 16px;
  animation: ticker 30s linear infinite;
}
@keyframes ticker {
  from { transform: translateX(100vw); }
  to   { transform: translateX(-100%); }
}

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px 6px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 14px; }
.crumb {
  padding: 6px 10px; border-radius: 8px; background: transparent; border: none;
  color: var(--muted); font-size: 14px;
}
.crumb:hover { background: #e9eefb; color: var(--primary-dark); }
.crumb.current { color: var(--text); font-weight: 600; cursor: default; }
.crumb.current:hover { background: transparent; color: var(--text); }
.crumb-sep { color: #cbd5e1; }
.status { margin-left: auto; font-size: 13px; color: var(--muted); }

/* Loading */
.loader {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 80px 20px; color: var(--muted); font-size: 15px; text-align: center;
}
.spinner {
  width: 42px; height: 42px; border-radius: 50%;
  border: 4px solid #dbeafe; border-top-color: var(--primary);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Busy overlay */
#busy {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: center; justify-content: center; background: rgba(15,23,42,.55);
}
#busy.show { display: flex; }
.busy-card {
  background: var(--surface); border-radius: 16px; padding: 28px 36px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,.25); font-size: 15px; color: var(--text);
}

/* Content */
.content { padding: 12px 24px 40px; }
.section-title {
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 18px 0 10px;
}
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.tile {
  position: relative; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; cursor: pointer;
  box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s, border-color .12s;
  display: flex; flex-direction: column; gap: 14px; min-height: 130px;
}
.tile:hover {
  transform: translateY(-2px); border-color: #c7d2fe; box-shadow: 0 8px 22px rgba(37,99,235,.12);
  z-index: 30;
}
.tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.badge {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.badge svg { width: 22px; height: 22px; }
.badge.folder { background: #fef3c7; color: var(--folder); }
.badge.pdf { background: #fee2e2; color: var(--pdf); }
.badge.img { background: #cffafe; color: var(--img); }
.tile-name {
  font-size: 14px; font-weight: 600; line-height: 1.35; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.tile-meta { font-size: 12px; color: var(--muted); margin-top: auto; }
.tile-actions {
  position: absolute; top: 12px; right: 12px; display: flex; gap: 6px;
  opacity: 0; transition: opacity .15s;
}
.tile:hover .tile-actions, .tile-actions:focus-within { opacity: 1; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { color: var(--primary); border-color: #bfdbfe; }
.icon-btn svg { width: 16px; height: 16px; }

/* Floating expiry tooltip (follows the mouse) */
#tip {
  position: fixed; z-index: 200; display: none;
  background: #1e293b; color: #fff; font-size: 12px; line-height: 1.7;
  padding: 10px 12px; border-radius: 10px; white-space: pre;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); pointer-events: none;
}

/* Search results */
.result-list {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow);
}
.result {
  display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.result:last-child { border-bottom: none; }
.result:hover { background: var(--surface-2); }
.result .badge { width: 38px; height: 38px; border-radius: 10px; }
.result .badge svg { width: 19px; height: 19px; }
.result-main { flex: 1; min-width: 0; }
.result-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-path { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-actions { display: flex; gap: 6px; flex-shrink: 0; }
.text-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 6px 12px; border-radius: 8px; font-size: 13px;
}
.text-btn:hover { border-color: #bfdbfe; color: var(--primary); }
.empty {
  text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px;
  background: var(--surface); border: 1px dashed #cbd5e1; border-radius: var(--radius);
}

/* Viewer */
#viewer {
  position: fixed; inset: 0; background: rgba(15,23,42,.75); z-index: 50;
  display: none; flex-direction: column;
}
#viewer.show { display: flex; }
.viewer-bar {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.viewer-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-body { flex: 1; overflow: auto; padding: 20px; }
.viewer-loading { display: none; color: #e2e8f0; }
.viewer-pages { display: none; flex-direction: column; align-items: center; gap: 16px; }
.viewer-pages canvas {
  max-width: 100%; height: auto; background: #fff; border-radius: 6px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.viewer-image { height: 100%; display: none; align-items: center; justify-content: center; }
.viewer-image img {
  max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
}

@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; padding: 12px 16px; }
  .search { order: 3; max-width: none; flex-basis: 100%; }
  .user-chip { display: none; }
  .toolbar, .content { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .tile-actions { opacity: 1; }
}

/* Print frame: tiny and transparent (not hidden), so the browser prints it reliably */
#printFrame {
  position: fixed; left: 0; bottom: 0; width: 1px; height: 1px;
  border: 0; opacity: 0; pointer-events: none;
}
</style>
</head>

const API_URL = 'https://script.google.com/macros/s/AKfycbz3aKtS-j9NusJxNbyQkwXTybXluoqghw4uXTq1wp3mb3UcIEiKqw1g3IBSMvnL816KwQ/exec';

let stack = [];

function setStatus(t) { $('status').textContent = t; }
function current() { return stack[stack.length - 1]; }
function esc(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// ============================================================
// SERVER REQUEST
// ============================================================

async function runServer(fn, ...args) {
  const user = firebase.auth().currentUser;
  if (!user) throw new Error('Please sign in');

  const token = await user.getIdToken();
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 60000);

  let resp;
  try {
    resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, token: token, args: args }),
      signal: controller.signal
    });
  } catch (err) {
    if (err && err.name === 'AbortError') {
      throw new Error('The server took more than 60 seconds. Please try again.');
    }
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }

  const text = await resp.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    throw new Error('Backend did not return data. Check the deployment is set to "Anyone".');
  }
  if (!data.ok) throw new Error(data.error || 'Server request failed.');
  return data.result;
}

function friendlyError(e) {
  const c = e && e.code ? e.code : '';
  if (c === 'auth/popup-blocked') return 'The sign-in window was blocked. Allow pop-ups for this page and try again.';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
  if (c === 'auth/network-request-failed') return 'Network error. Check your connection.';
  return e && e.message ? e.message : 'Sign-in failed. Please try again.';
}

$('googleBtn').onclick = () => {
  $('loginErr').textContent = '';
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  firebase.auth().signInWithPopup(provider)
    .catch(e => { $('loginErr').textContent = friendlyError(e); });
};

$('logoutBtn').onclick = () => firebase.auth().signOut();

firebase.auth().onAuthStateChanged(user => {
  if (user) {
    $('loginView').style.display = 'none';
    $('appView').style.display = 'block';
    $('userChip').textContent = user.email || '';
    if (!started) {
      started = true;
      start();
    }
  } else {
    $('appView').style.display = 'none';
    $('loginView').style.display = 'flex';
    started = false;
    stack = [];
    folderCache.clear();
    $('content').innerHTML = '';
    $('crumbs').innerHTML = '';
    setStatus('');
  }
});

async function start() {
  $('content').innerHTML = loaderHtml('Loading, please wait...');
  try {
    rootId = await runServer('getRootId');
    stack = [{ id: rootId, name: 'Home' }];
    loadCurrent();
    loadExpiryMap();
  } catch (e) {
    $('content').innerHTML = '';
    if (String(e.message).indexOf('Access denied') !== -1) {
      $('loginErr').textContent = 'This Google account is not allowed. Sign in with an approved account.';
      firebase.auth().signOut();
    } else {
      setStatus('Error: ' + e.message);
    }
  }
}

// ============================================================
// NAVIGATION
// ============================================================

function renderCrumbs() {
  const el = $('crumbs');
  el.innerHTML = '';
  stack.forEach((f, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '/';
      el.appendChild(sep);
    }
    const isLast = i === stack.length - 1;
    const b = document.createElement('button');
    b.className = 'crumb' + (isLast ? ' current' : '');
    b.textContent = f.name;
    if (!isLast) {
      b.onclick = () => { stack = stack.slice(0, i + 1); loadCurrent(); };
    }
    el.appendChild(b);
  });
  $('backBtn').disabled = stack.length <= 1;
}

function goInto(folder) { stack.push(folder); loadCurrent(); }
function goBack() { if (stack.length > 1) { stack.pop(); loadCurrent(); } }

function loadCurrent() {
  const id = current().id;
  renderCrumbs();

  const cached = folderCache.get(id);
  if (cached) {
    render(cached);
  } else {
    $('content').innerHTML = loaderHtml('Loading, please wait...');
    setStatus('');
  }

  runServer('listFolder', id)
    .then(res => {
      folderCache.set(id, res);
      if (current().id === id) render(res);
    })
    .catch(e => {
      if (!cached) {
        $('content').innerHTML = '<div class="empty">Could not load this folder.</div>';
        setStatus('Error: ' + e.message);
      }
    });
}

// Refresh: fetches the current folder from Drive, ignoring the server cache
function refreshCurrent() {
  const id = current().id;
  renderCrumbs();
  setStatus('Refreshing...');
  runServer('refreshFolder', id)
    .then(res => {
      folderCache.set(id, res);
      if (current().id === id) render(res);
    })
    .catch(e => setStatus('Error: ' + e.message));
}

// ============================================================
// RENDER
// ============================================================

function render(res) {
  const wrap = $('content');
  wrap.innerHTML = '';

  if (!res.folders.length && !res.files.length) {
    wrap.innerHTML = '<div class="empty">This folder is empty.</div>';
    setStatus('');
    return;
  }

  if (res.folders.length) {
    wrap.insertAdjacentHTML('beforeend', '<div class="section-title">Folders (' + res.folders.length + ')</div>');
    const g = document.createElement('div');
    g.className = 'grid';
    res.folders.forEach(f => g.appendChild(folderTile(f)));
    wrap.appendChild(g);
  }

  if (res.files.length) {
    wrap.insertAdjacentHTML('beforeend', '<div class="section-title">Files (' + res.files.length + ')</div>');
    const g = document.createElement('div');
    g.className = 'grid';
    res.files.forEach(f => g.appendChild(fileTile(f)));
    wrap.appendChild(g);
  }

  applyExpiryTips();
  setStatus(res.folders.length + ' folders, ' + res.files.length + ' files');
}

function folderTile(f) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.dataset.folder = f.name;
  el.innerHTML =
    '<div class="tile-top"><div class="badge folder">' + ICONS.folder + '</div></div>' +
    '<div class="tile-name">' + esc(f.name) + '</div>' +
    '<div class="tile-meta">Folder</div>';
  el.onclick = () => goInto({ id: f.id, name: f.name });
  return el;
}

function fileTile(f) {
  const isPdf = f.mime === 'application/pdf';
  const el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML =
    '<div class="tile-top"><div class="badge ' + (isPdf ? 'pdf' : 'img') + '">' +
    (isPdf ? ICONS.pdf : ICONS.img) + '</div></div>' +
    '<div class="tile-name">' + esc(f.name) + '</div>' +
    '<div class="tile-meta">' + (isPdf ? 'PDF document' : 'Image') + '</div>';

  const actions = document.createElement('div');
  actions.className = 'tile-actions';

  const pr = document.createElement('button');
  pr.className = 'icon-btn';
  pr.title = 'Print';
  pr.innerHTML = ICONS.print;
  pr.onclick = e => { e.stopPropagation(); printFile(f); };

  const dl = document.createElement('button');
  dl.className = 'icon-btn';
  dl.title = 'Download';
  dl.innerHTML = ICONS.download;
  dl.onclick = e => { e.stopPropagation(); downloadFile(f); };

  actions.appendChild(pr);
  actions.appendChild(dl);
  el.appendChild(actions);

  el.onclick = () => openItem(f);
  return el;
}

// ============================================================
// EXPIRY DATES ON FOLDER HOVER
// Works on folder tiles and on folder rows in search results.
// ============================================================

function applyExpiryTips() {
  document.querySelectorAll('[data-folder]').forEach(el => {
    const i = expiryMap[el.dataset.folder];
    if (!i) return;
    el.dataset.tip =
      'Registration expire: ' + (i.reg || '-') + '\n' +
      'Insurance expire: ' + (i.ins || '-') + '\n' +
      'MVPI expire: ' + (i.mvpi || '-');
  });
}

// One floating tooltip, placed next to the mouse so tiles never cover it
let tipEl = null;

function moveTip(e) {
  const pad = 14;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const w = tipEl.offsetWidth;
  const h = tipEl.offsetHeight;
  if (x + w > window.innerWidth) x = e.clientX - w - pad;
  if (y + h > window.innerHeight) y = e.clientY - h - pad;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}

function setupTooltip() {
  tipEl = document.createElement('div');
  tipEl.id = 'tip';
  document.body.appendChild(tipEl);

  document.addEventListener('mouseover', e => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!t) {
      tipEl.style.display = 'none';
      return;
    }
    tipEl.textContent = t.dataset.tip;
    tipEl.style.display = 'block';
    moveTip(e);
  });

  document.addEventListener('mousemove', e => {
    if (tipEl.style.display === 'block') moveTip(e);
  });
}

async function loadExpiryMap() {
  try {
    expiryMap = await runServer('getExpiryMap');
    applyExpiryTips();
  } catch (e) {
    // Dates are optional; the gallery still works without them
  }
}

// ============================================================
// SEARCH
// ============================================================

function resultRow(r) {
  const isPdf = r.mime === 'application/pdf';
  const kind = r.isFolder ? 'folder' : (isPdf ? 'pdf' : 'img');
  const where = ['Home'].concat((r.where || []).map(p => p.name)).join(' / ');

  const el = document.createElement('div');
  el.className = 'result';
  if (r.isFolder) el.dataset.folder = r.name;
  el.innerHTML =
    '<div class="badge ' + kind + '">' +
    (r.isFolder ? ICONS.folder : (isPdf ? ICONS.pdf : ICONS.img)) +
    '</div>' +
    '<div class="result-main">' +
    '<div class="result-name">' + esc(r.name) + '</div>' +
    '<div class="result-path">' + esc(where) + '</div>' +
    '</div>';

  if (!r.isFolder) {
    const actions = document.createElement('div');
    actions.className = 'result-actions';

    const pb = document.createElement('button');
    pb.className = 'text-btn';
    pb.textContent = 'Print';
    pb.onclick = e => { e.stopPropagation(); printFile({ id: r.id, name: r.name, mime: r.mime }); };

    const db = document.createElement('button');
    db.className = 'text-btn';
    db.textContent = 'Download';
    db.onclick = e => { e.stopPropagation(); downloadFile({ id: r.id, name: r.name }); };

    actions.appendChild(pb);
    actions.appendChild(db);
    el.appendChild(actions);
  }

  el.onclick = () => openResult(r);
  return el;
}

function doSearch() {
  const term = $('searchInput').value.trim();
  if (!term) { loadCurrent(); return; }

  const wrap = $('content');
  wrap.innerHTML = loaderHtml('Searching, please wait...');
  $('crumbs').innerHTML = '<span class="crumb current">Search: ' + esc(term) + '</span>';
  $('backBtn').disabled = true;
  setStatus('');

  runServer('searchItems', term)
    .then(res => {
      if (!res.length) {
        wrap.innerHTML = '<div class="empty">No matches for "' + esc(term) + '".</div>';
        setStatus('');
        return;
      }
      wrap.innerHTML = '';
      const list = document.createElement('div');
      list.className = 'result-list';
      res.forEach(r => list.appendChild(resultRow(r)));
      wrap.appendChild(list);
      applyExpiryTips();
      setStatus(res.length + ' matches');
    })
    .catch(e => {
      wrap.innerHTML = '';
      setStatus('Error: ' + e.message);
    });
}

function openResult(r) {
  $('searchInput').value = '';
  stack = [{ id: rootId, name: 'Home' }].concat(r.goto);
  loadCurrent();
  if (!r.isFolder) openItem({ id: r.id, name: r.name, mime: r.mime });
}

// ============================================================
// DOWNLOAD
// ============================================================

async function downloadFile(f) {
  setStatus('Preparing ' + f.name + '...');
  try {
    const res = await runServer('getImageData', f.id);
    const url = URL.createObjectURL(new Blob([base64ToBytes(res.data)], { type: res.mime }));
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setStatus('Downloaded ' + f.name);
  } catch (e) {
    setStatus('Download failed: ' + e.message);
  }
}

// ============================================================
// PRINT
// PDFs are printed from the original file (browser PDF viewer).
// Photos are printed as one sheet each, sized to fit the page.
// ============================================================

async function printFile(f) {
  showBusy('Preparing print, please wait...');
  try {
    const res = await runServer('getPrintData', f.id);
    if (res.mime === 'application/pdf') {
      printPdfDirect(res.data);
    } else {
      await printPages([{ src: 'data:' + res.mime + ';base64,' + res.data }]);
    }
  } catch (e) {
    hideBusy();
    setStatus('Print failed: ' + e.message);
  }
}

// Prints the original PDF through the browser's own PDF viewer
function printPdfDirect(b64) {
  const frame = $('printFrame');
  const blob = new Blob([base64ToBytes(b64)], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);

  frame.removeAttribute('srcdoc');

  frame.onload = () => {
    setTimeout(() => {
      hideBusy();
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
        setStatus('Print dialog opened');
      } catch (e) {
        setStatus('Print failed: ' + e.message);
      }
    }, 800);
  };

  frame.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}

// Measures each image so every sheet is landscape or portrait to match it
function measurePages(pages) {
  return Promise.all(pages.map(p => new Promise(resolve => {
    const im = new Image();
    im.onload = () => { p.land = im.naturalWidth > im.naturalHeight; resolve(); };
    im.onerror = () => { p.land = false; resolve(); };
    im.src = p.src;
  })));
}

// Prints photos: one sheet per image, never cropped
async function printPages(pages) {
  await measurePages(pages);

  const sheets = pages.map(p =>
    '<div class="sheet ' + (p.land ? 'land' : 'port') + '"><img src="' + p.src + '"></div>'
  ).join('');

  const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' +
    '@page land { size: landscape; margin: 0; }' +
    '@page port { size: portrait; margin: 0; }' +
    'html, body { margin: 0; padding: 0; background: #fff; }' +
    '* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }' +
    '.sheet { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; break-after: page; page-break-after: always; }' +
    '.sheet:last-child { break-after: auto; page-break-after: auto; }' +
    '.sheet.land { page: land; }' +
    '.sheet.port { page: port; }' +
    '.sheet img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }' +
    '</style></head><body>' + sheets + '</body></html>';

  const frame = $('printFrame');
  frame.onload = () => {
    const w = frame.contentWindow;
    const imgs = Array.from(w.document.images);
    const ready = imgs.map(img => img.complete ? Promise.resolve() :
      new Promise(resolve => { img.onload = resolve; img.onerror = resolve; }));

    Promise.all(ready).then(() => {
      setTimeout(() => {
        hideBusy();
        try {
          w.focus();
          w.print();
          setStatus('Print dialog opened');
        } catch (e) {
          setStatus('Print failed: ' + e.message);
        }
      }, 400);
    });
  };
  frame.srcdoc = doc;
}

// ============================================================
// VIEWER
// ============================================================

function openItem(f) {
  return f.mime === 'application/pdf' ? openPdf(f) : openImage(f);
}

function openViewerLoading(title) {
  $('viewerTitle').textContent = title;
  $('viewerLoading').style.display = 'flex';
  $('viewerPages').style.display = 'none';
  $('viewerImage').style.display = 'none';
  $('viewer').classList.add('show');
}

function showViewer(title, mode) {
  $('viewerTitle').textContent = title;
  $('viewerLoading').style.display = 'none';
  $('viewerPages').style.display = mode === 'pdf' ? 'flex' : 'none';
  $('viewerImage').style.display = mode === 'image' ? 'flex' : 'none';
  $('viewer').classList.add('show');
}

function closeViewerOnError(f, e) {
  $('viewer').classList.remove('show');
  setStatus('Could not open ' + f.name + ': ' + e.message);
}

// Returns true if a rendered page is blank (all white), so it can be skipped in the viewer
function isBlankCanvas(canvas) {
  const ctx = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 0; i < data.length; i += 4 * 7) {
    if (data[i] < 245 || data[i + 1] < 245 || data[i + 2] < 245) return false;
  }
  return true;
}

async function openPdf(f) {
  const prev = $('status').textContent;
  viewerFile = f;
  openViewerLoading(f.name);
  setStatus('');
  try {
    if (!window.pdfjsLib) throw new Error('PDF viewer library did not load');

    const res = await runServer('getViewData', f.id);
    const pdf = await pdfjsLib.getDocument({ data: base64ToBytes(res.data) }).promise;

    showViewer(f.name + ' (' + pdf.numPages + ' pages)', 'pdf');
    const pages = $('viewerPages');
    pages.innerHTML = '';

    const width = Math.min(window.innerWidth * 0.9, 900);
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const scale = (width / base.width) * (window.devicePixelRatio > 1 ? 1.25 : 1);
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;

      if (isBlankCanvas(canvas)) continue;
      pages.appendChild(canvas);
    }
    setStatus(prev);
  } catch (e) {
    closeViewerOnError(f, e);
  }
}

async function openImage(f) {
  const prev = $('status').textContent;
  viewerFile = f;
  openViewerLoading(f.name);
  setStatus('');
  try {
    const res = await runServer('getViewData', f.id);
    showViewer(f.name, 'image');
    $('viewerImg').src = 'data:' + res.mime + ';base64,' + res.data;
    setStatus(prev);
  } catch (e) {
    closeViewerOnError(f, e);
  }
}

function closeViewer() {
  $('viewer').classList.remove('show');
  $('viewerLoading').style.display = 'none';
  $('viewerPages').innerHTML = '';
  $('viewerImg').src = '';
  viewerFile = null;
}

// ============================================================
// EVENTS
// ============================================================

setupTooltip();

$('backBtn').onclick = goBack;
$('reloadBtn').onclick = refreshCurrent;
$('closeBtn').onclick = closeViewer;
$('viewerDownloadBtn').onclick = () => { if (viewerFile) downloadFile(viewerFile); };
$('viewerPrintBtn').onclick = () => { if (viewerFile) printFile(viewerFile); };

$('viewer').addEventListener('click', e => {
  if (e.target.classList.contains('viewer-body')) closeViewer();
});

$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); }
});

// Search as you type (waits half a second after you stop typing)
$('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  if (!e.target.value.trim()) { loadCurrent(); return; }
  searchTimer = setTimeout(doSearch, 500);
});
</script>
